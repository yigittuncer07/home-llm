services:
  frontend:
    build: ./app/frontend
    env_file: 
      - .env
    # ports:  # uncomment if you want the frontend accesible outside the docker network (e.g. for local development)
    #   - "${FRONTEND_PORT}:80"
    restart: unless-stopped

  backend:
    build: app/backend
    env_file: 
      - .env
    # ports:  # uncomment if you want the backend accesible outside the docker network (e.g. for local development)
    #   - "${BACKEND_PORT}:8000"
    depends_on:
      - db
      - redis
    volumes:
    - ./alembic.ini:/app/alembic.ini:ro
    - ./alembic:/app/alembic:ro
    # ensure migrations run before the API starts
    command: >
      sh -c "alembic upgrade head && uvicorn app:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped

  worker:
    build: app/backend
    env_file: 
      - .env
    depends_on:
      - db
      - redis
    command: python3 -m workers.LLM_worker
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      PGDATA: /var/lib/postgresql/data/pgdata
      
    volumes:
      - pgdata:/var/lib/postgresql/data
    # ports: # uncomment if you want the DB accesible outside the docker network (e.g. for local development)
    #   - "${DB_PORT}:5432"

  redis:
    image: redis:alpine
    restart: unless-stopped
    # ports:  # uncomment if you want redis accesible outside the docker network (e.g. for local development)
    #   - "${REDIS_PORT}:6379"
    volumes:
      - redisdata:/data

  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./app/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  vllm:
    image: vllm/vllm-openai:latest
    profiles:
      - vllm
    environment:
      - LLM_MODEL=${LLM_MODEL}
      - LLM_MAX_LEN=${LLM_MAX_LEN}
      - LLM_MAX_SEQS=${LLM_MAX_SEQS}
      - LLM_PORT=${LLM_PORT}
      - LLM_GPU_UTIL=${LLM_GPU_UTIL:-0.90}
      - LLM_QUANTIZATION=${LLM_QUANTIZATION:-}
      - LLM_ENFORCE_EAGER=${LLM_ENFORCE_EAGER:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ARGS="--model $$LLM_MODEL --max-model-len $$LLM_MAX_LEN --max-num-seqs $$LLM_MAX_SEQS --gpu-memory-utilization $$LLM_GPU_UTIL --port $$LLM_PORT"
        if [ -n "$$LLM_QUANTIZATION" ]; then ARGS="$$ARGS --quantization $$LLM_QUANTIZATION --load-format $$LLM_QUANTIZATION"; fi
        if [ -n "$$LLM_ENFORCE_EAGER" ]; then ARGS="$$ARGS --enforce-eager"; fi
        exec vllm serve $$ARGS
    ports: # uncomment if you dont want the LLM service accesible outside the docker network
      - "${LLM_PORT}:${LLM_PORT}"
    volumes:
      - model_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
              
volumes:
  pgdata:
  redisdata:
  model_cache: