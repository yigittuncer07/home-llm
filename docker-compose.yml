services:
  frontend:
    build: ./app/frontend
    env_file: 
      - .env
    environment:
      - WATCHPACK_POLLING=true
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

  backend:
    build: ./app/backend
    env_file: 
      - .env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      - db

  db:
    image: postgres
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "${DB_PORT:-5432}:5432"

  redis:
    image: redis:alpine
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data

  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./app/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

  vllm:
    image: vllm/vllm-openai:latest
    command: 
      - --model
      - ${LLM_MODEL}
      - --max-model-len
      - "${LLM_MAX_LEN}"
      - --max-num-seqs
      - "2"    
    ports:
      - "${LLM_PORT:-8001}:8000"
    volumes:
      - model_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
              
volumes:
  pgdata:
  redisdata:
  model_cache: