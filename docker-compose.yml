services:
  frontend:
    build: ./app/frontend
    environment:
      - WATCHPACK_POLLING=true
    ports:
      - "3000:3000"

  backend:
    build: ./app/backend
    ports:
      - "8000:8000"
    depends_on:
      - db

  db:
    image: postgres
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: ${postgres_password}
      POSTGRES_USER: ${postgres_user}
      POSTGRES_DB: ${postgres_db}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"

  redis:
      image: redis:alpine
      restart: always
      ports:
        - "6379:6379"
      volumes:
        - redisdata:/data

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./app/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
  redisdata: