info:
  name: stream
  type: http
  seq: 5

http:
  method: GET
  url: "{{base_url}}/chats/:chatId/stream"
  headers:
    - name: Accept
      value: text/event-stream
  params:
    - name: chatId
      value: "34"
      type: path
  auth:
    type: bearer
    token: "{{bearer_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
