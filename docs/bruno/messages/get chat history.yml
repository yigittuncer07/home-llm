info:
  name: get chat history
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/chats/:chatId/messages"
  params:
    - name: chatId
      value: "34"
      type: path
  auth:
    type: bearer
    token: "{{bearer_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
