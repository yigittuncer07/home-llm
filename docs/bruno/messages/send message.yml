info:
  name: send message
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/chats/:chatId/messages"
  params:
    - name: chatId
      value: "48"
      type: path
  body:
    type: json
    data: |-
      {
        "model": "Qwen/Qwen3.5-0.8B",
        "prompt": "write a story"
      }
  auth:
    type: bearer
    token: "{{bearer_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
